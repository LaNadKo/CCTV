x-processor-common: &processor-common
  build:
    context: .
    dockerfile: processor/Dockerfile
  environment: &processor-env
    BACKEND_URL: "http://backend:8000"
    API_KEY: "${PROCESSOR_API_KEY:-}"
    PROCESSOR_ID: "${PROCESSOR_ID:-}"
    PROCESSOR_CONNECT_CODE: "${PROCESSOR_CONNECT_CODE:-}"
    PROCESSOR_NAME: "${PROCESSOR_NAME:-processor-1}"
    PROCESSOR_NODE_UID: "${PROCESSOR_NODE_UID:-}"
    PROCESSOR_ADVERTISED_IP: "${PROCESSOR_ADVERTISED_IP:-}"
    PROCESSOR_RUNTIME_DIR: "/app/processor-runtime"
    MAX_WORKERS: "${PROCESSOR_MAX_WORKERS:-4}"
    POLL_INTERVAL: "${PROCESSOR_POLL_INTERVAL:-1}"
    HEARTBEAT_INTERVAL: "${PROCESSOR_HEARTBEAT_INTERVAL:-10}"
    FACE_SCAN_DIVISOR: "${FACE_SCAN_DIVISOR:-8}"
    OVERLAY_FRAME_DIVISOR: "${OVERLAY_FRAME_DIVISOR:-1}"
    RECORDING_SEGMENT_SECONDS: "${RECORDING_SEGMENT_SECONDS:-60}"
    RECORDINGS_DIR: "/app/media/recordings"
    SNAPSHOTS_DIR: "/app/media/snapshots"
    MEDIA_PORT: "${PROCESSOR_MEDIA_PORT:-8777}"
    MEDIA_TOKEN: "${PROCESSOR_MEDIA_TOKEN:-}"
  depends_on:
    backend:
      condition: service_healthy
  restart: unless-stopped
  ports:
    - "${PROCESSOR_MEDIA_BIND:-127.0.0.1}:${PROCESSOR_MEDIA_PORT:-8777}:${PROCESSOR_MEDIA_PORT:-8777}"
  volumes:
    - recordings:/app/media/recordings
    - snapshots:/app/media/snapshots
    - processor_runtime:/app/processor-runtime
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('MEDIA_PORT', '8777'), timeout=5).read()\"",
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 45s

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cctv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cctv}
      POSTGRES_DB: ${POSTGRES_DB:-cctv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cctv}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles:
      - core
      - server
      - server-cpu
      - server-gpu
      - gpu-nvidia

  backend:
    build: .
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-cctv}:${POSTGRES_PASSWORD:-cctv}@db:5432/${POSTGRES_DB:-cctv}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    volumes:
      - recordings:/app/recordings
      - snapshots:/app/snapshots
      - recordings_cache:/app/recordings_cache
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
      - core
      - server
      - server-cpu
      - server-gpu
      - gpu-nvidia

  processor:
    <<: *processor-common
    environment:
      <<: *processor-env
      PROCESSOR_ACCEL: "${PROCESSOR_ACCEL:-auto}"
    profiles:
      - with-processor
      - server-cpu

  processor-nvidia:
    <<: *processor-common
    build:
      context: .
      dockerfile: processor/Dockerfile.nvidia
    environment:
      <<: *processor-env
      PROCESSOR_NAME: "${PROCESSOR_NAME:-processor-nvidia-1}"
      PROCESSOR_ACCEL: "nvidia"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - with-gpu
      - processor-nvidia
      - server-gpu
      - gpu-nvidia

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "${MEDIAMTX_BIND:-127.0.0.1}:${MEDIAMTX_RTSP_PORT:-8554}:8554"
      - "${MEDIAMTX_BIND:-127.0.0.1}:${MEDIAMTX_RTMP_PORT:-1935}:1935"
      - "${MEDIAMTX_BIND:-127.0.0.1}:${MEDIAMTX_HLS_PORT:-8888}:8888"
    environment:
      MTX_PROTOCOLS: tcp
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    profiles:
      - core
      - server
      - server-cpu
      - server-gpu
      - gpu-nvidia

  frontend:
    build: ./frontend
    expose:
      - "80"
    environment:
      VITE_API_URL: "http://${DOMAIN:-localhost}:${BACKEND_PORT:-8000}"
    depends_on:
      - backend
    profiles:
      - with-frontend
      - server
      - server-cpu
      - server-gpu
      - gpu-nvidia

  nginx:
    build: ./nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      NGINX_HTTPS_ENABLED: ${NGINX_HTTPS_ENABLED:-false}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100m}
      NGINX_RELOAD_INTERVAL_SECONDS: ${NGINX_RELOAD_INTERVAL_SECONDS:-21600}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles:
      - with-nginx
      - public

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    profiles:
      - with-nginx
      - public

volumes:
  pgdata:
  recordings:
  snapshots:
  processor_runtime:
  recordings_cache:
  letsencrypt:
  certbot_www:
